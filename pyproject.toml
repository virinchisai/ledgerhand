[project]
name = "ledgerhand"
version = "0.1.0"
description = "Record LLM-discovered UI flows as typed capabilities; replay them deterministically."
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ledgerhand = "ledgerhand.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
